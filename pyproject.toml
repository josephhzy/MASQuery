[project]
name = "masquery"
version = "1.0.0"
description = "RAG-based Q&A for MAS regulatory documents with source tracing"
requires-python = ">=3.11"
authors = [
    { name = "Joseph" },
]
readme = "README.md"
license = { text = "MIT" }
# Note: torch uses a CPU-only wheel. When installing, pass:
#   pip install . --extra-index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "PyMuPDF>=1.24.0",
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.7.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "faiss-cpu>=1.7.0",
    "numpy<2",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "streamlit>=1.35.0",
    "Markdown>=3.4.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
